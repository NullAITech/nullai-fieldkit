<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FieldKit — OBS Overlay</title>
<style>
  body { margin:0; background:transparent; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:#fff; }
  #box { position:absolute; left:24px; bottom:24px; max-width:720px; background:rgba(6,7,10,.82);
         border:1px solid rgba(229,192,88,.5); border-radius:18px; padding:18px 22px; }
  #goal { font-size:15px; color:#c9cdd4; letter-spacing:.04em; }
  #step { font-size:34px; font-weight:800; color:#e5c058; margin:6px 0; line-height:1.15; }
  #meta { font-size:14px; color:#e5e7eb; }
  .badge { display:inline-block; font-size:12px; font-weight:800; border-radius:999px; padding:3px 10px; margin-right:6px; }
  #safe { background:#14532d; color:#bbf7d0; } #safe.bad { background:#7f1d1d; color:#fecaca; }
  #live { background:#7f1d1d; color:#fecaca; display:none; }
  #bar { height:6px; background:#26282e; border-radius:3px; margin-top:10px; }
  #fill { height:6px; background:#e5c058; border-radius:3px; width:0%; transition:width .5s; }
</style>
</head>
<body>
<div id="box">
  <div><span class="badge" id="live">● LIVE</span><span class="badge" id="safe">WATCHING</span></div>
  <div id="goal">FieldKit Mission Mode</div>
  <div id="step">Waiting for a mission…</div>
  <div id="meta">Next step appears here. Watches what changed · Asks before it acts.</div>
  <div id="bar"><div id="fill"></div></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const tok = q.get("token") || "";
let missionId = q.get("mission") || "";
const H = () => ({ "Authorization": "Bearer " + tok });
const base = location.origin;
async function tick() {
  try {
    const lr = await fetch(base + "/v1/live", { headers: H() });
    if (lr.ok) { const l = await lr.json(); document.getElementById("live").style.display = l.active ? "inline-block" : "none"; }
    if (!missionId) {
      const r = await fetch(base + "/v1/missions/latest", { headers: H() });
      if (r.ok) missionId = (await r.json()).id || "";
    }
    if (!missionId) return;
    const r = await fetch(base + "/v1/missions/" + missionId, { headers: H() });
    if (!r.ok) return;
    const m = await r.json();
    document.getElementById("goal").textContent = m.goal || "Mission";
    document.getElementById("step").textContent = m.complete ? "Mission complete" : ("Next step: " + (m.step || "—"));
    const total = (m.steps || []).length || 1;
    const done = (m.steps || []).filter(s => s.status === "done" || s.status === "skipped").length;
    document.getElementById("meta").textContent = `Step ${Math.min(m.current, total)} of ${total} · ${done} done`;
    document.getElementById("fill").style.width = Math.round(100 * done / total) + "%";
    const safe = document.getElementById("safe");
    if (m.last_event === "unsafe") { safe.textContent = "SAFETY PAUSE"; safe.className = "badge bad"; }
    else { safe.textContent = "WATCHING"; safe.className = "badge"; safe.id = "safe"; }
  } catch (e) { /* OBS source stays calm on hiccups */ }
}
setInterval(tick, 2000); tick();
</script>
</body>
</html>
