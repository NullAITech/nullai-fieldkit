<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldKit — Mission Mode (web trial)</title>
<link rel="manifest" href="/pwa/manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<style>
  :root { --ink:#111; --mut:#6b7280; --line:#e5e7eb; --card:#f7f7f8; --accent:#111; }
  * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { margin:0; background:#fff; color:var(--ink); }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:28px; margin:4px 0 2px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:14px; }
  .dots { height:14px; margin:8px 0 14px; background-image: radial-gradient(#c9cdd4 1.2px, transparent 1.3px); background-size: 9px 9px; opacity:.7; }
  .card { background:var(--card); border-radius:18px; padding:14px 16px; margin:12px 0; }
  .label { font-size:11px; letter-spacing:.12em; color:var(--mut); font-weight:700; }
  input, select, button { font-size:15px; border-radius:12px; border:1px solid var(--line); padding:10px 12px; background:#fff; color:var(--ink); }
  button { cursor:pointer; font-weight:600; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); width:100%; padding:14px; border-radius:16px; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  #stage { position:relative; border-radius:18px; overflow:hidden; background:#eef0f3; }
  video, #overlay { width:100%; display:block; }
  #overlay { position:absolute; inset:0; pointer-events:none; }
  #say { font-size:19px; font-weight:650; margin:6px 0; }
  #obs { color:var(--mut); font-size:13px; min-height:18px; }
  ol.steps { margin:8px 0 0; padding-left:20px; }
  ol.steps li { margin:4px 0; }
  ol.steps li.done { color:var(--mut); text-decoration:line-through; }
  ol.steps li.active { font-weight:700; }
  .badge { display:inline-block; font-size:12px; font-weight:700; border-radius:999px; padding:3px 10px; background:#e8f7ee; color:#157347; margin-right:6px; }
  .badge.off { background:#f3f4f6; color:var(--mut); }
  #log { font-size:12px; color:var(--mut); white-space:pre-wrap; max-height:120px; overflow:auto; }
</style>
</head>
<body>
<main>
  <h1>FieldKit</h1>
  <div class="sub">by NullAI · Mission Mode web trial — same Sessions + Missions APIs as the glasses app. No glasses needed.</div>
  <div class="dots"></div>

  <div class="card">
    <div class="label">CONNECT</div>
    <div class="row" style="margin-top:8px">
      <input id="relay" placeholder="Relay URL (blank = this host)">
      <input id="token" type="password" placeholder="Relay token">
    </div>
    <div class="row" style="margin-top:8px">
      <select id="preset">
        <option value="get-it-done">Get It Done</option>
        <option value="safety-first">Safety First</option>
        <option value="teach-me">Teach Me</option>
        <option value="social">Social</option>
      </select>
      <button id="btnShh">Shh (pause)</button>
    </div>
    <button class="primary" id="btnConnect" style="margin-top:10px">Connect</button>
    <div id="status" style="margin-top:8px;font-size:13px;color:var(--mut)">Not connected.</div>
  </div>

  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="card">
    <div class="label">YOUR COACH</div>
    <div id="say">Say a goal below, plan it, then Begin. The coach speaks first when a step is done.</div>
    <div id="obs"></div>
  </div>

  <div class="card">
    <div class="label">MISSION</div>
    <div class="row" style="margin-top:8px">
      <input id="goal" placeholder="One sentence: what are we doing?">
      <button id="btnPlan">Plan</button>
    </div>
    <div id="prior" style="font-size:13px;color:var(--mut);margin-top:6px"></div>
    <div id="badges" style="margin-top:8px"></div>
    <ol class="steps" id="steps"></ol>
    <div class="row" style="margin-top:10px">
      <button id="btnBegin" class="primary" disabled>Begin mission</button>
      <button id="btnNext" disabled>Next (manual)</button>
    </div>
  </div>

  <div class="card">
    <div class="label">TALK</div>
    <div class="row" style="margin-top:8px">
      <input id="talkText" placeholder="Say or type… try: jot down: bolt is stripped">
      <button id="btnTalk">Send</button>
    </div>
    <div id="log"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let ws = null, missionId = "", pendingId = "", stream = null, frameTimer = null;
const relayBase = () => ($("relay").value.trim() || location.origin).replace(/\/$/, "");
const tok = () => $("token").value.trim();
const H = () => ({ "Authorization": "Bearer " + tok(), "Content-Type": "application/json" });
function log(t) { const el = $("log"); el.textContent = (t + "\n" + el.textContent).slice(0, 3000); }
function status(t) { $("status").textContent = t; }

function speak(text) {
  $("say").textContent = text;
  try { const u = new SpeechSynthesisUtterance(text); speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    $("cam").srcObject = stream;
  } catch (e) { log("camera: " + e.message); }
}
function sendFrames() {
  clearInterval(frameTimer);
  const c = document.createElement("canvas");
  frameTimer = setInterval(() => {
    const v = $("cam"); if (!v.videoWidth || !ws || ws.readyState !== 1) return;
    c.width = 640; c.height = Math.round(640 * v.videoHeight / v.videoWidth);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    ws.send(JSON.stringify({ type: "frame", image: c.toDataURL("image/jpeg", 0.7).split(",")[1] }));
  }, 1500);
}
function drawBoxes(boxes) {
  const ov = $("overlay"), v = $("cam");
  ov.width = v.videoWidth || 640; ov.height = v.videoHeight || 480;
  const x = ov.getContext("2d"); x.clearRect(0, 0, ov.width, ov.height);
  x.strokeStyle = "#f5b301"; x.lineWidth = Math.max(2, ov.width / 200);
  x.fillStyle = "#f5b301"; x.font = `${Math.round(ov.width / 28)}px sans-serif`;
  for (const b of boxes || []) {
    x.strokeRect(b.x * ov.width, b.y * ov.height, b.w * ov.width, b.h * ov.height);
    if (b.label) x.fillText(b.label, b.x * ov.width + 4, Math.max(14, b.y * ov.height - 6));
  }
}

function connect(withMission) {
  if (ws) { try { ws.close(); } catch (e) {} }
  const url = relayBase().replace(/^http/, "ws") + "/v1/sessions?token=" + encodeURIComponent(tok());
  ws = new WebSocket(url);
  ws.onopen = () => {
    const hello = { type: "hello", provider: "spark", guide: true, preset: $("preset").value };
    if (withMission) hello.mission_id = withMission;
    ws.send(JSON.stringify(hello));
    sendFrames();
  };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "ready") status("Connected · provider " + m.provider + " · guide " + m.guide + " · preset " + m.preset);
    else if (m.type === "say") speak(m.text);
    else if (m.type === "observation") { $("obs").textContent = "Eyes: " + m.text; drawBoxes(m.highlight); }
    else if (m.type === "state") renderMission(m.mission);
    else if (m.type === "delta") { /* streamed turn text */ }
    else if (m.type === "error") status("Relay: " + m.detail);
  };
  ws.onclose = () => status("Disconnected.");
}

function renderSteps(m) {
  const ol = $("steps"); ol.innerHTML = "";
  for (const s of m.steps || []) {
    const li = document.createElement("li");
    li.textContent = s.text;
    li.className = s.status === "active" ? "active" : (s.status === "done" || s.status === "skipped") ? "done" : "";
    ol.appendChild(li);
  }
  const jotOk = !!m.jot_note_id;
  $("badges").innerHTML =
    `<span class="badge ${jotOk ? "" : "off"}">${jotOk ? "✓ Hermes Jot synced" : "Jot: not linked"}</span>` +
    `<span class="badge">✓ Obsidian engram</span>`;
}
async function fetchMission() {
  if (!missionId) return;
  const r = await fetch(relayBase() + "/v1/missions/" + missionId, { headers: H() });
  if (r.ok) renderSteps(await r.json());
}
function renderMission(ms) { if (ms && ms.id) { missionId = ms.id; fetchMission(); } }

$("btnConnect").onclick = async () => { await startCamera(); connect(missionId || undefined); };
$("btnPlan").onclick = async () => {
  const goal = $("goal").value.trim(); if (!goal) return;
  status("Planning with Muse Wonder…");
  const r = await fetch(relayBase() + "/v1/missions", { method: "POST", headers: H(), body: JSON.stringify({ goal, provider: "wonder" }) });
  if (!r.ok) { status("Plan failed (" + r.status + "). Check relay/token."); return; }
  const m = await r.json();
  pendingId = m.id; renderSteps(m);
  $("prior").textContent = (m.prior_notes || []).length
    ? "From last time: " + m.prior_notes.map(h => h.note).join(" · ") : "";
  $("btnBegin").disabled = false;
  speak("Plan ready. Review the steps, then tap Begin when you're ready.");
  status("Planned. Review, then Begin — nothing starts on its own.");
};
$("btnBegin").onclick = () => {
  missionId = pendingId; pendingId = "";
  $("btnBegin").disabled = true; $("btnNext").disabled = false;
  connect(missionId);
  speak("Mission started. Step one — go ahead, I'm watching.");
};
$("btnNext").onclick = async () => {
  if (!missionId) return;
  const r = await fetch(relayBase() + `/v1/missions/${missionId}/events`, { method: "POST", headers: H(), body: JSON.stringify({ type: "advance" }) });
  if (r.ok) { const b = await r.json(); renderSteps(b.mission); if (b.say) speak(b.say); }
};
$("btnShh").onclick = () => { if (ws) ws.send(JSON.stringify({ type: "pause" })); status("Coach paused. Send any message to resume."); };
$("btnTalk").onclick = () => {
  const t = $("talkText").value.trim(); if (!t || !ws) return;
  ws.send(JSON.stringify({ type: "speech", text: t, final: true, speaker: "wearer" }));
  log("You: " + t); $("talkText").value = "";
};
$("preset").onchange = () => { if (ws) ws.send(JSON.stringify({ type: "preset", name: $("preset").value })); };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/pwa/sw.js").catch(() => {});
</script>
</body>
</html>
