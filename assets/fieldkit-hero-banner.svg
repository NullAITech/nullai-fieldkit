<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060A"/>
      <stop offset="50%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="goldCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(212, 175, 55, 0.22)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.08)"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Frame -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>

  <!-- Top Accent Beam -->
  <rect x="40" y="2" width="1120" height="2" fill="url(#goldCyan)" opacity="0.8"/>

  <!-- Brand Glyph: Cybernetic Aperture / Wearable Eye -->
  <g transform="translate(56, 46)">
    <rect width="84" height="84" rx="20" fill="#0E1322" stroke="url(#goldCyan)" stroke-width="2"/>
    <circle cx="42" cy="42" r="28" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="4 3"/>
    <circle cx="42" cy="42" r="18" fill="rgba(212,175,55,0.12)" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="42" cy="42" r="7" fill="#38BDF8" filter="url(#glow)"/>
    <path d="M 42 16 L 42 22 M 42 62 L 42 68 M 16 42 L 22 42 M 62 42 L 68 42" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Header & Typography -->
  <g transform="translate(164, 48)">
    <!-- Hackathon Pill -->
    <rect x="0" y="0" width="530" height="26" rx="13" fill="url(#badgeGlow)" stroke="#D4AF37" stroke-opacity="0.5"/>
    <circle cx="14" cy="13" r="4" fill="#10B981"/>
    <text x="26" y="17" fill="#D4AF37" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.2">META GLOBAL AI DEVELOPER HACKATHON 2026 // SUBMISSION</text>

    <!-- Main Title -->
    <text x="0" y="64" fill="#FFFFFF" font-family="'Syne', 'Clash Display', 'Space Grotesk', sans-serif" font-size="34" font-weight="800" letter-spacing="0.5">FieldKit by NullAI</text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="94" fill="#94A3B8" font-family="'Inter', -apple-system, sans-serif" font-size="14.5" font-weight="400">
      A hands-free mission coach for Ray-Ban Meta glasses: <tspan fill="#38BDF8" font-weight="600">You talk. It plans. It watches. It guides.</tspan>
    </text>
  </g>

  <!-- 3 Enterprise Feature Pillars -->
  <g transform="translate(56, 178)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="344" height="142" rx="14" fill="#0C101D" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="18" y="18" width="118" height="20" rx="6" fill="rgba(212,175,55,0.12)"/>
    <text x="26" y="32" fill="#D4AF37" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.8">01 // PROACTIVE COACH</text>
    <text x="18" y="66" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Autonomous Step Advance</text>
    <text x="18" y="90" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" line-height="16">Muse Spark + Wonder vision loop detects completed work and speaks next action without tapping.</text>
    <text x="18" y="124" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10.5">p50 Latency: 1.27s (Flat 60 Turns)</text>

    <!-- Pillar 2 -->
    <rect x="372" y="0" width="344" height="142" rx="14" fill="#0C101D" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="390" y="18" width="114" height="20" rx="6" fill="rgba(56,189,248,0.12)"/>
    <text x="398" y="32" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.8">02 // SECURE RECON</text>
    <text x="390" y="66" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">4-Angle CharacterBoard</text>
    <text x="390" y="90" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">MediaPipe on-device embedding with Android Keystore AES-GCM encryption &amp; shareable trading card.</text>
    <text x="390" y="124" fill="#D4AF37" font-family="'JetBrains Mono', monospace" font-size="10.5">12 Spoken Triggers • Zero Face Cloud</text>

    <!-- Pillar 3 -->
    <rect x="744" y="0" width="344" height="142" rx="14" fill="#0C101D" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="762" y="18" width="138" height="20" rx="6" fill="rgba(129,140,248,0.12)"/>
    <text x="770" y="32" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.8">03 // ECOSYSTEM &amp; BROADCAST</text>
    <text x="762" y="66" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">RTMP Studio &amp; FastMCP</text>
    <text x="762" y="90" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Live audio/video streaming to Twitch/OBS with silent AAC clock sync and bidirectional Obsidian synch.</text>
    <text x="762" y="124" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10.5">299 Python + 112 JVM Tests Passed</text>
  </g>
</svg>